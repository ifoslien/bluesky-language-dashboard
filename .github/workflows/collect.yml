name: Collect Bluesky sample

on:
  schedule:
    # Every hour at 17 minutes past, in UTC
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sample the stream
        run: python collector.py --seconds 300 --max-posts 5000

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add language_summary.csv language_pairs.csv hashtags.csv
          git diff --cached --quiet || git commit -m "Add sample from $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
